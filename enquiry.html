<div class="booking-section">
    <h1>Book Your Appointment</h1>
    <p>Welcome to Mbali’s Beauty Salon. Book your beauty session with us!</p>

    <form id="bookingForm">
        <label>Full Name:</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>

        <label>Choose a Service:</label>
        <select name="service" required>
            <option value="">Select a service</option>
            <option>Wig Installation</option>
            <option>Braids</option>
            <option>Ponytails</option>
            <option>Haircuts</option>
            <option>Nail Services</option>
        </select>

        <label>Appointment Date:</label>
        <input type="date" name="date" required>

        <label>Appointment Time:</label>
        <input type="time" name="time" required>

        <label>Additional Message:</label>
        <textarea name="message" placeholder="Any special requests?"></textarea>

        <button type="submit">Book Now</button>
    </form>

    <p id="bookingMessage"></p>

<script src="enquiry.css"></script>
